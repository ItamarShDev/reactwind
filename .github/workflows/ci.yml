name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Style Check
        run: bun run check

      - name: Type Check
        run: bun run typecheck

      - name: Check public types
        run: bun run test:types

      - name: Build library
        run: bun run build

      - name: Build Storybook
        run: bun run build-storybook

      - name: Install Next.js example dependencies
        run: npm ci --ignore-scripts --prefix examples/nextjs-demo

      - name: Lint Next.js example
        run: npm run lint --prefix examples/nextjs-demo

      - name: Build Next.js example
        run: npm run build --prefix examples/nextjs-demo
        env:
          NODE_ENV: production
